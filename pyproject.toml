[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-ip-resolver"
version = "0.1.0"
description = "Resolve public IP addresses against published cloud-provider IP ranges."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Dan Richards" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
